[package]
name = "deepfilter-vst"
version = "1.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["assert_process_allocs"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }


# Releaseとlocal buildで同じDeepFilterNet sourceを使うためcommitを固定する。
# 「default-model」を「default-model-ll」に変えると低遅延modelになる。
df = { git = "https://github.com/Rikorose/DeepFilterNet.git", rev = "d375b2d8309e0935d165700c91da9de862a99c31", package = "deep_filter", features = ["tract", "default-model", "transforms"] }


# ndarray は df が使用するバージョンに合わせる
ndarray = "0.15"

# Pin tract versions to match DeepFilterNet upstream (v0.5.7-pre uses 0.21.4)
tract-core = "=0.21.4"
tract-onnx = "=0.21.4"
tract-pulse = "=0.21.4"
tract-hir = "=0.21.4"
tract-data = "=0.21.4"
tract-linalg = "=0.21.4"

log = "0.4"

